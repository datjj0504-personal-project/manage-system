spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/factory_dashboard}
    username: ${DB_USERNAME:dashboard_user}
    password: ${DB_PASSWORD:changeme_in_prod}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 0
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: false
